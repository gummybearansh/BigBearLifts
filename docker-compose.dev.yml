# Local Postgres only. Production compose lands in Milestone 10.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: bbl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: bigbearlifts
    ports:
      - "5432:5432"
    volumes:
      - bbl_pgdata:/var/lib/postgresql/data

volumes:
  bbl_pgdata:
